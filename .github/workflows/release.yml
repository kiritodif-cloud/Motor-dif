name: CI/CD & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: motor_dif.exe
            archive_name: motor_dif-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: motor_dif
            archive_name: motor_dif-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check --verbose

      - name: Cargo Test
        run: cargo test --bin motor_dif --verbose

      - name: Cargo Build Release
        run: cargo build --release --bin motor_dif

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/motor_dif -Force
          Copy-Item target/release/motor_dif.exe -Destination dist/motor_dif/
          Copy-Item -Recurse assets -Destination dist/motor_dif/
          Copy-Item README.md -Destination dist/motor_dif/ -ErrorAction SilentlyContinue
          Copy-Item AGENT_GUIDE.md -Destination dist/motor_dif/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/motor_dif/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/motor_dif
          cp target/release/motor_dif dist/motor_dif/
          cp -r assets dist/motor_dif/
          cp README.md dist/motor_dif/ || true
          cp AGENT_GUIDE.md dist/motor_dif/ || true
          tar -czvf ${{ matrix.archive_name }} -C dist/motor_dif .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 14

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p final-release
          find release-artifacts -type f -name "motor_dif-*" -exec cp {} final-release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
